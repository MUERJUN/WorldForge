plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.version
group = project.group

loom {
	splitEnvironmentSourceSets()

	mods {
		"worldforge" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		// v0.4.0: a dedicated client run that jumps STRAIGHT into a world, so the
		// in-game automated check can capture real in-world block-render evidence
		// without depending on the title screen or on opening a world at runtime.
		// Usage: ./gradlew runClientInWorld -PwfWorld="New World"
		clientInWorld {
			client()
			configName = "Minecraft Client (in-world autotest)"
			programArgs "--quickPlaySingleplayer", project.findProperty("wfWorld") ?: "New World"
			property "worldforge.autotest", "1"
		}
		// v0.5.3 P0-3: export-screen full client acceptance via QuickPlay — a
		// SEPARATE automation flag so StudioAutoTest and ExportScreenAutoTest
		// never run in the same client instance (they would fight over screens).
		clientExportTest {
			client()
			configName = "Minecraft Client (export autotest)"
			programArgs "--quickPlaySingleplayer", project.findProperty("wfWorld") ?: "New World"
			property "worldforge.export.autotest", "1"
		}
		// v0.7.0: chat-screen client acceptance via QuickPlay — its own flag so
		// the studio, export and chat harnesses never fight over the screen.
		clientChatTest {
			client()
			configName = "Minecraft Client (chat autotest)"
			programArgs "--quickPlaySingleplayer", project.findProperty("wfWorld") ?: "New World"
			property "worldforge.chat.autotest", "1"
		}
	}
}

fabricApi {
	// Adds the runGameTestServer task: dedicated-server GameTest runner with
	// -Dfabric-api.gametest injected (Fabric Loom 1.12.7 feature).
	configureTests {
		modId = "worldforge"
		enableGameTests = true
		enableClientGameTests = false
		clearRunDirectory = true
	}
}

// v0.5.5: cap the gameTest JVM — on memory-tight machines (page file nearly
// exhausted by other apps) the default 2G+ reservation fails to commit.
tasks.named('runGameTest') {
	jvmArgs '-Xmx1G'
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
	useJUnitPlatform()
	testLogging {
		events "passed", "skipped", "failed"
		exceptionFormat "full"
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

// Byte-reproducible archives (release verification #6): fixed entry
// timestamps and stable ordering, independent of build time / host.
tasks.withType(AbstractArchiveTask).configureEach {
	preserveFileTimestamps = false
	reproducibleFileOrder = true
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}
	repositories {
	}
}
