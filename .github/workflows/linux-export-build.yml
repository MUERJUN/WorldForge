name: linux-export-build

# v0.5.7 P2: real Linux verification of the exporter — blank Gradle user
# home, no system Gradle, Java 21. The exported projects are generated by
# the JUnit suite (ThreeProjectGenerationTest) and built here on Linux.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  linux-export-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # deliberately NO gradle cache — blank GRADLE_USER_HOME proves the
      # export works on a clean player machine
      - name: Generate the three export projects
        run: ./gradlew test --tests "dev.worldforge.ThreeProjectGenerationTest" --console=plain

      - name: Build alpha/beta/gamma on Linux (gradlew, no system gradle)
        run: bash scripts/build-three-projects.sh

      - name: Run exported GameTests on Linux (real Fabric load)
        run: |
          for p in alpha_mod/alpha_mod beta_mod/beta_mod gamma_mod/gamma_mod; do
            echo "== $p"
            (cd "build/three-projects/$p" && ./gradlew runGameTest --no-daemon --console=plain | tee /tmp/gt.log | grep "required tests passed")
          done
