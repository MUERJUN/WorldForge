name: linux-export-build

# v0.6.0-gate P0-1: real Linux verification of the exporter.
# Java 21, isolated GRADLE_USER_HOME (blank cache), NO system Gradle — every
# project builds through its own wrapper. All three export projects must
# generate, build, AND run their Fabric GameTests; the script has no SKIP
# path and propagates every failure (set -euo pipefail).

on:
  push:
    tags: ['v*']
    branches: [main]
  workflow_dispatch:

# The action majors below are the current ones: actions/checkout@v7,
# actions/setup-java@v6 and actions/upload-artifact@v7 run on the Node 24
# runtime. The previous v4 majors used Node 20, which GitHub deprecated on
# runners in September 2025.
jobs:
  linux-export-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Show toolchain (builds use ONLY each project's wrapper)
        run: |
          java -version
          # ubuntu-latest ships a system gradle; the isolation proof is that
          # every invocation below is ./gradlew with a blank GRADLE_USER_HOME.
          gradle --version 2>/dev/null | head -3 || echo "no system gradle"

      - name: Generate the three export projects (JUnit)
        run: ./gradlew test --tests "dev.worldforge.ThreeProjectGenerationTest" --console=plain

      # v0.7.0 flow C: the chat really drives a standalone-mod build.
      # The test is opt-in because it runs a REAL Gradle build.
      - name: Chat-driven export (flow C, real Gradle build)
        run: ./gradlew runGameTest -PwfChatExport --console=plain

      - name: Build + GameTest alpha/beta/gamma on Linux (wrapper-only)
        run: bash scripts/build-three-projects.sh

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linux-export-build-evidence
          path: |
            build/three-projects/*/*/build/libs/*.jar
            build/three-projects/*/*/build/reports
          if-no-files-found: warn
